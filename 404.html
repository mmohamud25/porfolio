<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 | mmohamud.me</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    [data-theme="light"]{--bg:#f8fafc;--card:#fff;--text:#1a2540;--gray:#64748b;--accent:#0066cc;--border:rgba(26,37,64,0.1);}
    [data-theme="dark"]{--bg:#080e1c;--card:#0f1a2e;--text:#eef2ff;--gray:#7a8599;--accent:#00d4ff;--border:rgba(0,212,255,0.1);}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;transition:background 0.3s;}
    .wrap{text-align:center;max-width:500px;}
    .code{font-family:'IBM Plex Mono',monospace;font-size:6rem;font-weight:700;color:var(--accent);line-height:1;margin-bottom:16px;opacity:0.8;}
    h1{font-size:1.5rem;font-weight:600;margin-bottom:12px;}
    p{color:var(--gray);line-height:1.7;margin-bottom:32px;font-size:0.95rem;}
    .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
    .btn-home{background:var(--accent);color:var(--bg);padding:12px 28px;border-radius:6px;font-weight:700;font-size:0.86rem;text-decoration:none;transition:opacity 0.3s;}
    .btn-home:hover{opacity:0.85;}
    .btn-back{border:1.5px solid var(--border);color:var(--gray);padding:12px 28px;border-radius:6px;font-weight:600;font-size:0.86rem;text-decoration:none;transition:all 0.3s;cursor:pointer;background:transparent;font-family:'DM Sans',sans-serif;}
    .btn-back:hover{border-color:var(--accent);color:var(--accent);}
    .tag{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;color:var(--accent);border:1px solid var(--border);padding:5px 14px;border-radius:20px;display:inline-block;margin-bottom:24px;}
  </style>
  <script>
    const h=new Date().getHours();
    document.documentElement.setAttribute('data-theme',(h>=18||h<6)?'dark':'light');
  </script>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="tag">// page not found</div>
    <h1>This page does not exist</h1>
    <p>The page you are looking for may have been moved, deleted, or never existed. Head back home and keep exploring.</p>
    <div class="btns">
      <a href="index.html" class="btn-home">Back to Home</a>
      <button class="btn-back" onclick="history.back()">Go Back</button>
    </div>
  </div>
</body>
</html>
