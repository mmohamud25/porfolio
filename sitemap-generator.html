<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Sitemap Generator | mmohamud.me</title>
  <style>
    body{font-family:monospace;padding:30px;background:#f8fafc;color:#1a2540;}
    pre{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:20px;overflow-x:auto;font-size:.82rem;line-height:1.6;}
    button{background:#0066cc;color:#fff;border:none;padding:10px 22px;border-radius:6px;cursor:pointer;font-size:.86rem;margin-bottom:16px;}
    button:hover{opacity:.85;}
    .note{font-size:.82rem;color:#64748b;margin-bottom:16px;}
  </style>
</head>
<body>
  <h2>Sitemap Generator</h2>
  <p class="note">This generates a sitemap.xml for mmohamud.me. Copy the output and save as sitemap.xml in your GitHub repository root.</p>
  <button onclick="generate()">Generate Sitemap</button>
  <pre id="output">Click Generate to create your sitemap...</pre>
  <script>
    function generate(){
      const base='https://mmohamud.me';
      const today=new Date().toISOString().split('T')[0];
      const blogs=JSON.parse(localStorage.getItem('mm_blogs')||'[]').filter(b=>b.status!=='draft');
      const projects=JSON.parse(localStorage.getItem('mm_projects')||'[]');
      let urls=[
        {loc:base+'/',priority:'1.0',freq:'weekly'},
        {loc:base+'/#about',priority:'0.8',freq:'monthly'},
        {loc:base+'/#projects',priority:'0.9',freq:'weekly'},
        {loc:base+'/#blog',priority:'0.9',freq:'daily'},
        {loc:base+'/#contact',priority:'0.7',freq:'monthly'},
      ];
      blogs.forEach(b=>{urls.push({loc:base+'/#blog/'+encodeURIComponent(b.title),priority:'0.8',freq:'monthly'});});
      const xml=`<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
${urls.map(u=>`  <url>
    <loc>${u.loc}</loc>
    <lastmod>${today}</lastmod>
    <changefreq>${u.freq}</changefreq>
    <priority>${u.priority}</priority>
  </url>`).join('\n')}
</urlset>`;
      document.getElementById('output').textContent=xml;
    }
  </script>
</body>
</html>
